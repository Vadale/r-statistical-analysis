<g font-family="DejaVu Sans, sans-serif"><text x="54" y="59" fill="#8ac9ff" font-size="18" font-weight="600">HOW IT WORKS</text><rect x="54" y="94" width="358" height="187" rx="18" fill="#152238" stroke="#3b4c66"/><text x="77" y="133" fill="#8ac9ff" font-size="20" font-weight="600">01</text><text x="77" y="173" fill="#f2f5fb" font-size="24" font-weight="600">Frame</text><text x="77" y="215" fill="#c5d0df" font-size="17" font-weight="400">Question, study design,</text><text x="77" y="244" fill="#c5d0df" font-size="17" font-weight="400">data quality and constraints</text><path d="M424 183h25m-8-7 8 7-8 7" fill="none" stroke="#8ac9ff" stroke-width="2"/><rect x="462" y="94" width="358" height="187" rx="18" fill="#152238" stroke="#3b4c66"/><text x="485" y="133" fill="#8ac9ff" font-size="20" font-weight="600">02</text><text x="485" y="173" fill="#f2f5fb" font-size="24" font-weight="600">Analyse</text><text x="485" y="215" fill="#c5d0df" font-size="17" font-weight="400">Appropriate R methods,</text><text x="485" y="244" fill="#c5d0df" font-size="17" font-weight="400">uncertainty and diagnostics</text><path d="M832 183h25m-8-7 8 7-8 7" fill="none" stroke="#8ac9ff" stroke-width="2"/><rect x="870" y="94" width="358" height="187" rx="18" fill="#152238" stroke="#3b4c66"/><text x="893" y="133" fill="#8ac9ff" font-size="20" font-weight="600">03</text><text x="893" y="173" fill="#f2f5fb" font-size="24" font-weight="600">Deliver</text><text x="893" y="215" fill="#c5d0df" font-size="17" font-weight="400">Interpretable results, plots</text><text x="893" y="244" fill="#c5d0df" font-size="17" font-weight="400">and rerunnable artifacts</text></g></svg>
