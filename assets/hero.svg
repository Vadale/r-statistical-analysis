<g font-family="DejaVu Sans, sans-serif"><rect x="62" y="65" width="48" height="5" rx="2" fill="#8ac9ff"/><text x="62" y="112" fill="#b1bfd3" font-size="17" font-weight="500">VADALE / OPEN SOURCE AGENT SKILLS</text><text x="62" y="213" fill="#f2f5fb" font-size="53" font-weight="700">R Statistical</text><text x="62" y="280" fill="#f2f5fb" font-size="53" font-weight="700">Analysis</text><text x="65" y="381" fill="#c5d0df" font-size="23" font-weight="400">From a statistical question</text><text x="65" y="416" fill="#c5d0df" font-size="23" font-weight="400">to estimates, uncertainty and plots.</text><text x="65" y="451" fill="#c5d0df" font-size="23" font-weight="400">Keep the code. Inspect the result.</text><rect x="65" y="522" width="397" height="43" rx="21" fill="#8ac9ff"/><text x="85" y="550" fill="#101b30" font-size="17" font-weight="600">Instructions you can inspect. Outputs too.</text><rect x="701" y="153" width="517" height="365" rx="22" fill="#101929" stroke="#3b4c66"/><text x="730" y="195" fill="#8ac9ff" font-size="15" font-weight="600">ANALYSIS DELIVERY / SCHEMATIC</text><path d="M756 326h409M960 236v170" stroke="#465a76" stroke-width="2" stroke-dasharray="6 6"/><path d="M819 300h234m-234-9v18m234-18v18" stroke="#8ac9ff" stroke-width="4"/><circle cx="937" cy="300" r="9" fill="#8ac9ff"/><text x="734" y="384" fill="#c5d0df" font-size="22" font-weight="400">Estimate + interval + assumptions</text><text x="734" y="431" fill="#c5d0df" font-size="22" font-weight="400">Code + diagnostics + session info</text><text x="734" y="484" fill="#aab8cc" font-size="16" font-weight="400">Execution is evidence. Interpretation matters.</text></g></svg>
