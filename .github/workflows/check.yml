name: Skill checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - run: python -m pip install -r requirements-dev.txt
      - name: Parse Python, R and YAML metadata
        run: |
          python - <<'PYCODE'
          import ast, json, pathlib, yaml
          for path in pathlib.Path('.').rglob('*.py'):
              ast.parse(path.read_text(), filename=str(path))
          skill = pathlib.Path('integrations/skills/r-statistical-analysis')
          metadata = yaml.safe_load((skill/'SKILL.md').read_text().split('---',2)[1])
          plugin = json.loads(pathlib.Path('integrations/plugin.json').read_text())
          assert metadata['name'] == plugin['name'] == 'r-statistical-analysis'
          assert metadata['metadata']['version'] == plugin['version']
          assert 0 < len(metadata['description']) <= 1024
          assert isinstance(yaml.safe_load((skill/'agents/openai.yaml').read_text())['interface'], dict)
          PYCODE
          Rscript --vanilla -e 'for (p in list.files("integrations", pattern="[.]R$", recursive=TRUE, full.names=TRUE)) invisible(parse(p))'
      - run: Rscript --vanilla tests/skills/r-statistical-analysis/test-runner.R .
      - run: python tests/assistant-integration/test-tools.py
      - run: python tests/skills/r-statistical-analysis/test-artifacts.py
